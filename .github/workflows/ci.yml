name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint correctness rules
        run: ruff check src/

      - name: Compile sources
        run: python -m compileall -q src

      - name: Import smoke
        run: |
          python -c "import mcp_server.main"
          python -c "import mcp_server.api.routes"
          python -c "import mcp_server.tools.mcp_tools"

      - name: Run tests
        run: pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build exact commit image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mcp-server:${{ github.sha }}

  deploy:
    needs: [verify, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: mcp-server-production
      cancel-in-progress: false
    steps:
      - name: Require deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"

      - name: Deploy exact verified commit
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          EXPECTED_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            cd /opt/mcp-server

            if [ -n "$(git status --porcelain)" ]; then
              echo "Refusing deployment: production worktree is dirty"
              git status --short
              exit 1
            fi

            git fetch origin main
            remote_sha="$(git rev-parse origin/main)"
            if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
              echo "Deployment superseded by newer main: expected=$EXPECTED_SHA remote=$remote_sha"
              exit 0
            fi

            git checkout main
            git merge --ff-only origin/main
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

            bash scripts/deploy-production.sh "$EXPECTED_SHA"
