name: Manual Production Deploy

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: mcp-server-production
      cancel-in-progress: false
    steps:
      - name: Require deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"

      - name: Deploy selected main commit
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          EXPECTED_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            cd /opt/mcp-server

            if [ -n "$(git status --porcelain)" ]; then
              echo "Refusing deployment: production worktree is dirty"
              git status --short
              exit 1
            fi

            git fetch origin main
            remote_sha="$(git rev-parse origin/main)"
            if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
              echo "Refusing stale manual deployment: expected=$EXPECTED_SHA remote=$remote_sha"
              exit 1
            fi

            git checkout main
            git merge --ff-only origin/main
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

            bash scripts/deploy-production.sh "$EXPECTED_SHA"
