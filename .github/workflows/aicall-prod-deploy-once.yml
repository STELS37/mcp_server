name: AI Call Production Deploy Once

on:
  push:
    branches:
      - ops/aicall-prod-deploy-87b29fd5
    paths:
      - .github/workflows/aicall-prod-deploy-once.yml

permissions:
  contents: read

jobs:
  deploy-ai-call:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Deploy exact AI Call release through existing server SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -Eeuo pipefail
            EXPECTED_SHA="87b29fd5ed3c3be1fb585a3b3de0cf5173aacb38"
            PROD_DIR="/a0/usr/projects/ai_call_prod"
            TMP_SCRIPT="/tmp/ai_call_deploy_${EXPECTED_SHA}.sh"

            echo "AI_CALL_DEPLOY_BEGIN"
            echo "remote_user=$(id -un) uid=$(id -u) host=$(hostname)"

            if [ ! -e "$PROD_DIR/.git" ]; then
              echo "AI_CALL_PROD_NOT_FOUND:$PROD_DIR" >&2
              exit 42
            fi

            cd "$PROD_DIR"
            git fetch --prune origin main
            ACTUAL_SHA="$(git rev-parse origin/main)"
            echo "origin_main=$ACTUAL_SHA expected=$EXPECTED_SHA"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "AI_CALL_SHA_MISMATCH" >&2
              exit 43
            fi

            git show "${EXPECTED_SHA}:scripts/deploy_prod_atomic.sh" > "$TMP_SCRIPT"
            chmod 700 "$TMP_SCRIPT"
            /bin/bash -n "$TMP_SCRIPT"

            if [ "$(id -u)" -eq 0 ]; then
              AI_CALL_DEPLOY_EXPECTED_SHA="$EXPECTED_SHA" /bin/bash "$TMP_SCRIPT"
            elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo -n env AI_CALL_DEPLOY_EXPECTED_SHA="$EXPECTED_SHA" /bin/bash "$TMP_SCRIPT"
            else
              echo "AI_CALL_ROOT_REQUIRED" >&2
              exit 44
            fi

            FINAL_SHA="$(git -C "$PROD_DIR" rev-parse HEAD)"
            echo "final_sha=$FINAL_SHA"
            test "$FINAL_SHA" = "$EXPECTED_SHA"
            systemctl is-active --quiet ai-call-prod.service
            systemctl is-active --quiet agent3-runtime-prod.service
            curl -fsS --max-time 5 http://127.0.0.1:8017/health
            echo
            curl -fsS --max-time 5 http://127.0.0.1:8037/health
            echo
            echo "AI_CALL_DEPLOY_OK"
